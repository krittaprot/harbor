[package]
name = "launchd-ui"
version = "1.4.2"
description = "A GUI for managing macOS launchd agents and daemons"
authors = ["azu"]
license = "MIT"
repository = "https://github.com/azu/launchd-ui"
edition = "2024"
rust-version = "1.88.0"

[lib]
name = "launchd_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
smoke-test = []

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10.0", features = ["tray-icon", "image-png"] }
plist = "1"
thiserror = "2"
dirs = "6"
sysinfo = "0.37"
libproc = "0.14"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
libc = "0.2"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"
