[package]
name = "launchd-ui"
version = "1.5.2"
description = "Harbor: macOS service monitoring for people and agents"
authors = ["azu"]
license = "MIT"
repository = "https://github.com/azu/launchd-ui"
default-run = "launchd-ui"
edition = "2024"
rust-version = "1.90.0"

[lib]
name = "launchd_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
smoke-test = []

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10.0", features = ["tray-icon", "image-png"] }
plist = "1"
thiserror = "2"
dirs = "6"
sysinfo = "0.37"
libproc = "0.14"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
libc = "0.2"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
tauri = { version = "2.10.0", features = ["test"] }
