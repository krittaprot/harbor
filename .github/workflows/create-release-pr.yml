name: Create Release PR
on:
  workflow_dispatch:
    inputs:
      semver:
        description: "New version (semver)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Bumps package.json, tauri.conf.json, Cargo.toml and Cargo.lock together
      # and fails if they were not in sync beforehand.
      - name: Bump version
        id: version
        env:
          SEMVER: ${{ inputs.semver }}
        run: |
          node scripts/bump-version.ts "$SEMVER"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # The PR body becomes the release notes when the PR is merged.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$RUNNER_TEMP/release-notes.md"

      # A maintainer opens the PR: repository policy blocks Actions-created PRs,
      # and GITHUB_TOKEN-created PRs would not trigger normal pull_request CI.
      - name: Prepare branch and maintainer PR link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BASE: harbor/main
        run: bash scripts/prepare-release-branch.sh
